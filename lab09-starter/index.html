<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trail Finder — COSC 219 Lab 9</title>

  <!-- Link Bootstrap's CSS here. Use the CDN link from the Lecture 18 slides,
       and check the version is still current. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <script type="module" src="main.js"></script>
</head>
<body>

  <!-- A navbar that collapses on small screens.
       You need .navbar, .navbar-toggler and .navbar-collapse, wired with the
       data-bs-* attributes. Bootstrap's JavaScript does the rest. -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Trail Finder</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="check.html">Checker</a>
      </div>
    </div>
  </div>
</nav>

  <!-- The page content, in a .container.

       A .row with:
         · a search text field   col-12 col-md-6
         · a rating select       col-12 col-md-4
         · a Load button         col-12 col-md-2
       Gutters with g-3, not margins of your own.
       Every control needs a real <label> — form-label is styling, not a label. -->
<main class="container py-4">
  <h1>Trail Finder</h1>

  <div class="row g-3 align-items-end mb-4">

    <div class="col-12 col-md-6">
      <label for="search" class="form-label">Search</label>
      <input type="text" id="search" class="form-control"
             placeholder="Search trails">
    </div>

    <div class="col-12 col-md-4">
      <label for="rating" class="form-label">Rating</label>
      <select id="rating" class="form-select">
        <option value="">All ratings</option>
        <option value="easy">Easy</option>
        <option value="moderate">Moderate</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <div class="col-12 col-md-2">
      <button type="button" id="load" class="btn btn-primary w-100">
        Load
      </button>
    </div>

  </div>

  <!-- The four state panels. Give each one an id so you can show and hide it,
       and start them all with d-none.

         #state-loading   a .spinner-border, with .visually-hidden text inside
         #state-error     an .alert.alert-danger
         #state-empty     a message
         #state-loaded    the .row that holds the cards, using
                          row-cols-1 row-cols-md-2 row-cols-lg-3 -->
    <div id="state-loading" class="d-none">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div id="state-error" class="alert alert-danger d-none">
    Unable to load trails.
  </div>

  <div id="state-empty" class="alert alert-info d-none">
    No trails found.
  </div>

  <div id="state-loaded"
       class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 d-none">
  </div>

</main>

  <!-- Bootstrap's JavaScript bundle goes here, at the end of the body. -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
